
# --- atdd quality gate (appended by /atdd:init) ---------------------------------------------
# These rules report as warnings. The gate fails on any warning in *changed* files, so existing
# code keeps building while every change has to be clean.
[*.cs]
# Cognitive complexity (SonarAnalyzer.CSharp; threshold in SonarLint.xml)
dotnet_diagnostic.S3776.severity = warning
# Cyclomatic complexity, maintainability index, class coupling (thresholds in CodeMetricsConfig.txt)
dotnet_diagnostic.CA1502.severity = warning
dotnet_diagnostic.CA1505.severity = warning
dotnet_diagnostic.CA1506.severity = warning
dotnet_diagnostic.CA1509.severity = warning
# Unused private members, written-but-never-read members, unused parameters (needs EnforceCodeStyleInBuild)
dotnet_diagnostic.IDE0051.severity = warning
dotnet_diagnostic.IDE0052.severity = warning
dotnet_diagnostic.IDE0060.severity = warning
dotnet_code_quality_unused_parameters = all

# Generated Reqnroll code-behind is not ours to judge.
[*.feature.cs]
generated_code = true
# ---------------------------------------------------------------------------------------------
