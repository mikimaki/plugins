[project]
name = "stepgoals"
version = "0.4.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest", "pytest-bdd", "pytest-cov", "ruff", "lizard", "complexipy", "mutmut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["mutants", ".atdd", ".venv"]
bdd_features_base_dir = "features/"

[tool.mutmut]
source_paths = ["src/"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["features/"]
